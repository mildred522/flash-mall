name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      frontend: ${{ steps.filter.outputs.frontend }}
      web: ${{ steps.filter.outputs.web }}
      ci: ${{ steps.filter.outputs.ci }}
      entry_contract: ${{ steps.filter.outputs.entry_contract }}
      auth_contract: ${{ steps.filter.outputs.auth_contract }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'app/**/*.api'
              - 'app/**/*.proto'
              - 'app/**/*.thrift'
              - 'scripts/**/*.go'
              - 'build/docker/**'
              - 'deploy/config/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
            web:
              - 'web/**'
            ci:
              - '.github/workflows/**'
              - 'scripts/ci/**'
              - 'deploy/docker-compose.yml'
              - 'build/docker/**'
            entry_contract:
              - 'app/entry/api/entry.api'
            auth_contract:
              - 'app/auth/api/auth.api'

  go-checks:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 6494kj06
        ports:
          - 3306:3306
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p6494kj06"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Prepare test databases
        run: |
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -p6494kj06 -e "CREATE DATABASE IF NOT EXISTS mall_auth DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -p6494kj06 -e "CREATE DATABASE IF NOT EXISTS mall_order DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -p6494kj06 -e "CREATE DATABASE IF NOT EXISTS mall_product DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Parse changed API contracts
        if: needs.changes.outputs.entry_contract == 'true' || needs.changes.outputs.auth_contract == 'true'
        env:
          ENTRY_CHANGED: ${{ needs.changes.outputs.entry_contract }}
          AUTH_CHANGED: ${{ needs.changes.outputs.auth_contract }}
        run: |
          go install github.com/zeromicro/go-zero/tools/goctl@v1.9.2
          if [[ "$ENTRY_CHANGED" == "true" ]]; then
            goctl api format --stdin < app/entry/api/entry.api > /tmp/entry-api.formatted
          fi
          if [[ "$AUTH_CHANGED" == "true" ]]; then
            goctl api format --stdin < app/auth/api/auth.api > /tmp/auth-api.formatted
          fi

      - name: Build service binaries
        run: >-
          go build
          ./app/gateway/hertz
          ./app/inventory/kitex
          ./app/auth/api
          ./app/order/rpc
          ./app/product/rpc
          ./app/entry/api

  frontend-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build:shop && npm run build:admin

  web-build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build

  ci-config-check:
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check CI shell syntax
        run: find scripts/ci -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  fast-ci:
    name: Fast CI
    if: always()
    needs:
      - changes
      - go-checks
      - frontend-build
      - web-build
      - ci-config-check
    runs-on: ubuntu-latest
    steps:
      - name: Require successful relevant checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          GO_RESULT: ${{ needs.go-checks.result }}
          FRONTEND_RESULT: ${{ needs.frontend-build.result }}
          WEB_RESULT: ${{ needs.web-build.result }}
          CI_RESULT: ${{ needs.ci-config-check.result }}
        run: |
          [[ "$CHANGES_RESULT" == "success" ]]
          for result in "$GO_RESULT" "$FRONTEND_RESULT" "$WEB_RESULT" "$CI_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "required component result: $result" >&2; exit 1 ;;
            esac
          done
