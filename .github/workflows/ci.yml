name: CI

on:
  pull_request:
  push:
    branches:
      - codex/arch-hertz-kitex

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ci: ${{ steps.filter.outputs.ci }}
      entry_contract: ${{ steps.filter.outputs.entry_contract }}
      auth_contract: ${{ steps.filter.outputs.auth_contract }}
      desktop_launcher: ${{ steps.filter.outputs.desktop_launcher }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'app/**/*.api'
              - 'app/**/*.proto'
              - 'app/**/*.thrift'
              - 'scripts/**/*.go'
              - 'build/docker/**'
              - 'deploy/config/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - 'artifacts/web/**'
              - 'scripts/ci/check-web-artifacts.mjs'
            ci:
              - '.github/workflows/**'
              - 'scripts/ci/**'
              - 'scripts/k8s/init-db.sql'
              - 'scripts/k8s/sql/**'
              - 'scripts/k8s/build-init-db.mjs'
              - 'deploy/docker-compose.yml'
              - 'build/docker/**'
            entry_contract:
              - 'app/entry/api/entry.api'
            auth_contract:
              - 'app/auth/api/auth.api'
            desktop_launcher:
              - 'tools/FlashMall.Launcher/**'
              - 'tools/FlashMall.Launcher.Tests/**'
              - 'scripts/local/flash-mall-control.sh'
              - 'scripts/local/test-flash-mall-control.sh'
              - 'scripts/local/start-compose-all.sh'
              - 'scripts/local/install-desktop-launcher.ps1'
              - 'scripts/local/test-install-desktop-launcher.ps1'
              - '.github/workflows/ci.yml'

  go-checks:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 6494kj06
        ports:
          - 3306:3306
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p6494kj06"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Prepare test databases
        run: >-
          docker exec -i "${{ job.services.mysql.id }}"
          mysql --force --default-character-set=utf8mb4 -uroot -p6494kj06
          < scripts/k8s/init-db.sql

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Parse changed API contracts
        if: needs.changes.outputs.entry_contract == 'true' || needs.changes.outputs.auth_contract == 'true'
        env:
          ENTRY_CHANGED: ${{ needs.changes.outputs.entry_contract }}
          AUTH_CHANGED: ${{ needs.changes.outputs.auth_contract }}
        run: |
          go install github.com/zeromicro/go-zero/tools/goctl@v1.9.2
          if [[ "$ENTRY_CHANGED" == "true" ]]; then
            goctl api format --stdin < app/entry/api/entry.api > /tmp/entry-api.formatted
          fi
          if [[ "$AUTH_CHANGED" == "true" ]]; then
            goctl api format --stdin < app/auth/api/auth.api > /tmp/auth-api.formatted
          fi

      - name: Build service binaries
        run: >-
          go build
          ./app/gateway/hertz
          ./app/inventory/kitex
          ./app/auth/api
          ./app/order/rpc
          ./app/product/rpc
          ./app/entry/api

  frontend-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend sources
        run: cd frontend && npm ci && npm run build
      - name: Parse committed single-file artifacts
        run: node scripts/ci/check-web-artifacts.mjs

  ci-config-check:
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Check CI shell syntax
        run: find scripts/ci -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Check database initialization aggregate
        run: node scripts/ci/check-init-db-modules.mjs
      - name: Check durable upload and charset configuration
        run: node scripts/ci/check-durable-storage.mjs
      - name: Check Go toolchain configuration
        run: node scripts/ci/check-go-toolchain.mjs
      - name: Check GitHub Action runtimes
        run: node scripts/ci/check-action-runtimes.mjs
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  desktop-launcher:
    needs: changes
    if: needs.changes.outputs.desktop_launcher == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Test desktop launcher
        run: dotnet test tools/FlashMall.Launcher.Tests/FlashMall.Launcher.Tests.csproj -c Release
      - name: Test WSL control protocol
        shell: bash
        run: sh -n scripts/local/flash-mall-control.sh && sh scripts/local/test-flash-mall-control.sh
      - name: Test launcher installer
        shell: pwsh
        run: ./scripts/local/test-install-desktop-launcher.ps1
      - name: Publish desktop launcher
        run: dotnet publish tools/FlashMall.Launcher/FlashMall.Launcher.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true

  fast-ci:
    name: Fast CI
    if: always()
    needs:
      - changes
      - go-checks
      - frontend-build
      - ci-config-check
      - desktop-launcher
    runs-on: ubuntu-latest
    steps:
      - name: Require successful relevant checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          GO_RESULT: ${{ needs.go-checks.result }}
          FRONTEND_RESULT: ${{ needs.frontend-build.result }}
          CI_RESULT: ${{ needs.ci-config-check.result }}
          DESKTOP_RESULT: ${{ needs.desktop-launcher.result }}
        run: |
          [[ "$CHANGES_RESULT" == "success" ]]
          for result in "$GO_RESULT" "$FRONTEND_RESULT" "$CI_RESULT" "$DESKTOP_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "required component result: $result" >&2; exit 1 ;;
            esac
          done
