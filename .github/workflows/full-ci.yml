name: Full Integration CI

on:
  workflow_dispatch:
    inputs:
      run_legacy:
        description: Also run the legacy entry-api smoke flow
        required: true
        default: false
        type: boolean
      build_images:
        description: Build all service images after smoke succeeds
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '0 18 * * *'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: full-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  primary-smoke:
    name: Hertz + Kitex smoke
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded web
        run: cd web && npm ci && npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Hertz end-to-end smoke
        env:
          FLASH_MALL_SMOKE_GATEWAY: hertz
        run: bash scripts/ci/smoke-e2e.sh

  legacy-smoke:
    name: Legacy entry-api smoke
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_legacy) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'legacy-ci'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded web
        run: cd web && npm ci && npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run legacy end-to-end smoke
        env:
          FLASH_MALL_SMOKE_GATEWAY: entry
        run: bash scripts/ci/smoke-e2e.sh

  docker-matrix:
    name: Select Docker images
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.build_images) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_images: ${{ steps.matrix.outputs.has_images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect affected images
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - 'go.mod'
              - 'go.sum'
              - 'app/common/**'
              - 'build/docker/local-binary.Dockerfile'
            hertz:
              - 'app/gateway/hertz/**'
              - 'app/entry/api/internal/handler/web/**'
              - 'app/product/rpc/product/**'
              - 'app/product/rpc/productclient/**'
              - 'app/order/rpc/order/**'
              - 'app/order/rpc/orderclient/**'
              - 'app/inventory/kitex/kitex_gen/**'
              - 'build/docker/hertz-gateway.Dockerfile'
            inventory:
              - 'app/inventory/**'
              - 'build/docker/inventory-kitex.Dockerfile'
            order:
              - 'app/order/**'
              - 'app/product/rpc/product/**'
              - 'app/product/rpc/productclient/**'
              - 'app/inventory/kitex/kitex_gen/**'
              - 'build/docker/order-rpc.Dockerfile'
            product:
              - 'app/product/**'
              - 'build/docker/product-rpc.Dockerfile'
            auth:
              - 'app/auth/**'
              - 'build/docker/auth-api.Dockerfile'
            entry:
              - 'app/entry/**'
              - 'web/**'
              - 'build/docker/entry-api.Dockerfile'

      - name: Create build matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHARED: ${{ steps.filter.outputs.shared }}
          HERTZ: ${{ steps.filter.outputs.hertz }}
          INVENTORY: ${{ steps.filter.outputs.inventory }}
          ORDER: ${{ steps.filter.outputs.order }}
          PRODUCT: ${{ steps.filter.outputs.product }}
          AUTH: ${{ steps.filter.outputs.auth }}
          ENTRY: ${{ steps.filter.outputs.entry }}
        run: |
          images='[]'
          add_image() {
            images="$(jq -c --arg image "$1" --arg dockerfile "$2" '. + [{image: $image, dockerfile: $dockerfile}]' <<< "$images")"
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$SHARED" == "true" ]]; then
            HERTZ=true
            INVENTORY=true
            ORDER=true
            PRODUCT=true
            AUTH=true
            ENTRY=true
          fi

          [[ "$HERTZ" == "true" ]] && add_image hertz-gateway build/docker/hertz-gateway.Dockerfile
          [[ "$INVENTORY" == "true" ]] && add_image inventory-kitex build/docker/inventory-kitex.Dockerfile
          [[ "$ORDER" == "true" ]] && add_image order-rpc build/docker/order-rpc.Dockerfile
          [[ "$PRODUCT" == "true" ]] && add_image product-rpc build/docker/product-rpc.Dockerfile
          [[ "$AUTH" == "true" ]] && add_image auth-api build/docker/auth-api.Dockerfile
          [[ "$ENTRY" == "true" ]] && add_image entry-api build/docker/entry-api.Dockerfile

          matrix="$(jq -c '{include: unique_by(.image)}' <<< "$images")"
          count="$(jq '.include | length' <<< "$matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if (( count > 0 )); then
            echo "has_images=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_images=false" >> "$GITHUB_OUTPUT"
          fi

  docker-build:
    name: Docker ${{ matrix.image }}
    needs:
      - primary-smoke
      - docker-matrix
    if: needs.primary-smoke.result == 'success' && needs.docker-matrix.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.docker-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: local/${{ matrix.image }}:ci
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
