<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">Flash Mall architecture</title>
  <desc id="description">A modern visual showing Hertz, Go-zero RPC, Kitex and the Flash Mall data infrastructure.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b1b"/>
      <stop offset="0.55" stop-color="#121638"/>
      <stop offset="1" stop-color="#0a1830"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <rect width="1200" height="480" rx="28" fill="url(#background)"/>
  <circle cx="1030" cy="55" r="180" fill="#5b21b6" opacity=".18" filter="url(#glow)"/>
  <circle cx="170" cy="470" r="190" fill="#0284c7" opacity=".14" filter="url(#glow)"/>
  <path d="M40 380 C240 310 350 455 570 370 S900 310 1160 390" fill="none" stroke="#38bdf8" stroke-opacity=".12" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="72" y="94" fill="#a5b4fc" font-size="15" font-weight="700" letter-spacing="4">TRANSACTION-READY COMMERCE</text>
    <text x="72" y="159" fill="#f8fafc" font-size="58" font-weight="800" letter-spacing="-2">FLASH MALL</text>
    <rect x="72" y="185" width="420" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="72" y="229" fill="#cbd5e1" font-size="20">真实交易链路 · 渐进式微服务 · 可复现工程证据</text>

    <g transform="translate(72 284)">
      <rect width="230" height="94" rx="18" fill="#171b3d" stroke="#8b5cf6" stroke-opacity=".55"/>
      <circle cx="32" cy="30" r="7" fill="#a78bfa"/>
      <text x="51" y="36" fill="#f5f3ff" font-size="20" font-weight="700">Hertz Gateway</text>
      <text x="24" y="69" fill="#9ca3af" font-size="14">HTTP · Auth · Orchestration</text>
    </g>

    <path d="M312 331 H378" stroke="#64748b" stroke-width="2"/>
    <path d="M370 324 L380 331 L370 338" fill="none" stroke="#64748b" stroke-width="2"/>

    <g transform="translate(390 284)">
      <rect width="230" height="94" rx="18" fill="#131f3c" stroke="#38bdf8" stroke-opacity=".55"/>
      <circle cx="32" cy="30" r="7" fill="#38bdf8"/>
      <text x="51" y="36" fill="#eff6ff" font-size="20" font-weight="700">Go-zero RPC</text>
      <text x="24" y="69" fill="#9ca3af" font-size="14">Product Read · Order Domain</text>
    </g>

    <path d="M630 331 H696" stroke="#64748b" stroke-width="2"/>
    <path d="M688 324 L698 331 L688 338" fill="none" stroke="#64748b" stroke-width="2"/>

    <g transform="translate(708 284)">
      <rect width="216" height="94" rx="18" fill="#10283b" stroke="#34d399" stroke-opacity=".55"/>
      <circle cx="32" cy="30" r="7" fill="#34d399"/>
      <text x="51" y="36" fill="#ecfdf5" font-size="20" font-weight="700">Kitex Inventory</text>
      <text x="24" y="69" fill="#9ca3af" font-size="14">Reserve · Confirm · Release</text>
    </g>

    <g transform="translate(954 284)">
      <rect width="174" height="94" rx="18" fill="#111827" stroke="#475569"/>
      <text x="22" y="30" fill="#f8fafc" font-size="14" font-weight="700">MySQL · Redis</text>
      <text x="22" y="54" fill="#f8fafc" font-size="14" font-weight="700">RabbitMQ · DTM</text>
      <text x="22" y="76" fill="#94a3b8" font-size="12">Trace · Metrics · Logs</text>
    </g>

    <text x="72" y="435" fill="#64748b" font-size="13">HERTZ  ·  GO-ZERO  ·  KITEX  ·  DTM SAGA  ·  TRANSACTIONAL OUTBOX  ·  REDIS SHARDS</text>
  </g>
</svg>
