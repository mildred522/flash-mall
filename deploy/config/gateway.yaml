Name: hertz-gateway
ListenOn: 0.0.0.0:8889
DataSource: ${FLASH_MALL_PRODUCT_DATASOURCE}
OrderDataSource: ${FLASH_MALL_ORDER_DATASOURCE}
AuthDataSource: ${FLASH_MALL_AUTH_DATASOURCE}
JwtAuthSecret: ${FLASH_MALL_JWT_AUTH_SECRET}
AuthServiceBaseURL: ${FLASH_MALL_AUTH_SERVICE_BASE_URL}
PaymentCallbackSecret: ${FLASH_MALL_PAYMENT_CALLBACK_SECRET}
PaymentCallbackMaxSkewSeconds: 300
SandboxPaymentTokenTTLSeconds: 900
InventoryKitexEndpoint: ${FLASH_MALL_INVENTORY_KITEX_ENDPOINT}
DtmServer: dtm:36790
OrderRpcTarget: order-rpc:8090
DtmTimeoutToFailSeconds: 120
DtmRequestTimeoutSeconds: 6
DtmWaitResult: true
EnableLiveStockOverlay: false
UploadDir: /data/flash-mall/uploads
CacheRedisAddr: ${FLASH_MALL_CACHE_REDIS_ADDR}
CachePrefix: flashmall:hertz:public:v1
CacheEnableL1: true
CacheEnableL2: true
CacheStaleWhileRevalidate: true
CacheAllowStaleOnError: true
CacheL1TTLMillis: 2000
CacheSoftTTLSeconds: 30
CacheHardTTLSeconds: 120
CacheMaxEntries: 512
ProductExistenceFilterEnabled: true
ProductExistenceFilterPrefix: flashmall:hertz:existence:product
ProductExistenceFilterExpectedItems: 1000000
ProductExistenceFilterFalsePositiveRate: 0.01
ProductExistenceFilterRebuildHours: 6
ProductExistenceFilterBatchSize: 1000
ProductNegativeCacheTTLSeconds: 30

ProductRpcConf:
  Endpoints:
    - product-rpc:8080
  Etcd:
    Hosts:
      - etcd:2379
    Key: product.rpc
  Timeout: 3000

OrderRpcConf:
  Endpoints:
    - order-rpc:8090
  Etcd:
    Hosts:
      - etcd:2379
    Key: order.rpc
  Timeout: 3000

Observability:
  Tracing:
    Enabled: true
    ServiceName: hertz-gateway
    Exporter: otlphttp
    Endpoint: http://jaeger:4318/v1/traces
    SampleRatio: 1
