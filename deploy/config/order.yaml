Name: order.rpc
ListenOn: 0.0.0.0:8090
Timeout: 8000
CpuThreshold: 900
Middlewares:
  Trace: true
  Recover: true
  Stat: true
  Prometheus: true
  Breaker: true

DataSource: ${FLASH_MALL_ORDER_DATASOURCE}

RedisConf:
  Host: redis:6379
  Type: node

Etcd:
  Hosts:
    - etcd:2379
  Key: order.rpc

ProductRpcConf:
  Endpoints:
    - product-rpc:8080
  Etcd:
    Hosts:
      - etcd:2379
    Key: product.rpc
  Timeout: 8000

InventoryKitexEndpoint: ${FLASH_MALL_INVENTORY_KITEX_ENDPOINT}
RequireInventoryReserve: true

PaymentProvider: ${FLASH_MALL_PAYMENT_PROVIDER}
PaymentExpireMinutes: 15
PaymentSweepIntervalSec: 10
PaymentFinalizeIntervalSec: 10
PaymentFinalizeBatchSize: 1000
PaymentFinalizeConcurrency: 16
AlipaySandbox:
  AppID: ${FLASH_MALL_ALIPAY_APP_ID}
  GatewayURL: ${FLASH_MALL_ALIPAY_GATEWAY_URL}
  PrivateKey: ${FLASH_MALL_ALIPAY_PRIVATE_KEY}
  AlipayPublicKey: ${FLASH_MALL_ALIPAY_PUBLIC_KEY}
  NotifyURL: ${FLASH_MALL_ALIPAY_NOTIFY_URL}
  RequestTimeoutMs: 8000

PprofAddr: 0.0.0.0:6061
MetricsAddr: 0.0.0.0:9091

Observability:
  Tracing:
    Enabled: true
    ServiceName: order-rpc
    Exporter: otlphttp
    Endpoint: http://jaeger:4318/v1/traces
    SampleRatio: ${FLASH_MALL_TRACING_SAMPLE_RATIO}

DatabasePool:
  MaxOpenConns: 24
  MaxIdleConns: 12
  ConnMaxLifetimeSeconds: 300
  ConnMaxIdleTimeSeconds: 120

StockShardCount: 4

RabbitMQURL: ${FLASH_MALL_RABBITMQ_URL}
RabbitMQExchange: order.events
RabbitMQRouteKey: order.created
OutboxBatchSize: 20
OutboxPollMs: 1000
OutboxRetrySec: 5
OutboxTimeoutSec: 60
OutboxMaxRetries: 8
OutboxSingleActive: true
OutboxLeaderLockKey: order:outbox:publisher:leader
OutboxLeaderLockTTL: 90
