Name: product.rpc
ListenOn: 0.0.0.0:8080
Timeout: 8000
CpuThreshold: 900
Middlewares:
  Trace: true
  Recover: true
  Stat: true
  Prometheus: true
  Breaker: true

DataSource: ${FLASH_MALL_PRODUCT_DATASOURCE}

PprofAddr: 0.0.0.0:6062
MetricsAddr: 0.0.0.0:9092

Observability:
  Tracing:
    Enabled: false
    ServiceName: product-rpc
    Exporter: otlphttp
    Endpoint: http://jaeger:4318/v1/traces
    SampleRatio: ${FLASH_MALL_TRACING_SAMPLE_RATIO}

DatabasePool:
  MaxOpenConns: 16
  MaxIdleConns: 8
  ConnMaxLifetimeSeconds: 300
  ConnMaxIdleTimeSeconds: 120

StockBucketCount: 4
LegacyStockMutationEnabled: ${FLASH_MALL_PRODUCT_LEGACY_STOCK_MUTATION_ENABLED}

Etcd:
  Hosts:
    - etcd:2379
  Key: product.rpc
