services:
  dtm:
    image: yedf/dtm
    pull_policy: never
    container_name: dtm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "36789:36789" # HTTP
      - "36790:36790" # gRPC
    depends_on:
      etcd:
        condition: service_started
      mysql:
        condition: service_healthy

  etcd:
    image: bitnamilegacy/etcd:3.5
    pull_policy: never
    container_name: etcd
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    ports:
      - "2379:2379"

  mysql:
    image: mysql:5.7
    pull_policy: never
    container_name: mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${FLASH_MALL_MYSQL_ROOT_PASSWORD:-6494kj06}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:latest
    pull_policy: never
    container_name: redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis-init:
    image: redis:latest
    pull_policy: never
    container_name: flash-mall-redis-init
    depends_on:
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        redis-cli -h redis SETNX stock:100:0 2500
        redis-cli -h redis SETNX stock:100:1 2500
        redis-cli -h redis SETNX stock:100:2 2500
        redis-cli -h redis SETNX stock:100:3 2500
        redis-cli -h redis SETNX stock:101:0 2500
        redis-cli -h redis SETNX stock:101:1 2500
        redis-cli -h redis SETNX stock:101:2 2500
        redis-cli -h redis SETNX stock:101:3 2500
        redis-cli -h redis SETNX stock:102:0 2500
        redis-cli -h redis SETNX stock:102:1 2500
        redis-cli -h redis SETNX stock:102:2 2500
        redis-cli -h redis SETNX stock:102:3 2500
        redis-cli -h redis SETNX stock:103:0 2500
        redis-cli -h redis SETNX stock:103:1 2500
        redis-cli -h redis SETNX stock:103:2 2500
        redis-cli -h redis SETNX stock:103:3 2500
        redis-cli -h redis SETNX stock:104:0 2500
        redis-cli -h redis SETNX stock:104:1 2500
        redis-cli -h redis SETNX stock:104:2 2500
        redis-cli -h redis SETNX stock:104:3 2500
        redis-cli -h redis SETNX stock:201:0 9
        redis-cli -h redis SETNX stock:201:1 9
        redis-cli -h redis SETNX stock:201:2 9
        redis-cli -h redis SETNX stock:201:3 9
        redis-cli -h redis SETNX stock:202:0 7
        redis-cli -h redis SETNX stock:202:1 7
        redis-cli -h redis SETNX stock:202:2 7
        redis-cli -h redis SETNX stock:202:3 7
        redis-cli -h redis SETNX stock:211:0 11
        redis-cli -h redis SETNX stock:211:1 11
        redis-cli -h redis SETNX stock:211:2 10
        redis-cli -h redis SETNX stock:211:3 10
        redis-cli -h redis SETNX stock:212:0 14
        redis-cli -h redis SETNX stock:212:1 14
        redis-cli -h redis SETNX stock:212:2 14
        redis-cli -h redis SETNX stock:212:3 13
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.12-management
    pull_policy: never
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${FLASH_MALL_RABBITMQ_USER:-flashmall}
      RABBITMQ_DEFAULT_PASS: ${FLASH_MALL_RABBITMQ_PASSWORD:-flashmall-local}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  jaeger:
    image: jaegertracing/all-in-one:1.57
    pull_policy: if_not_present
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4318:4318"
      - "14268:14268"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: flash-mall-prometheus
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9099:9090"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: flash-mall-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${FLASH_MALL_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${FLASH_MALL_GRAFANA_PASSWORD:-flashmall}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${FLASH_MALL_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  mysql-init:
    image: mysql:5.7
    pull_policy: never
    container_name: flash-mall-mysql-init
    environment:
      MYSQL_ROOT_PASSWORD: ${FLASH_MALL_MYSQL_ROOT_PASSWORD:-6494kj06}
      FLASH_MALL_DEMO_SEED_ENABLED: ${FLASH_MALL_DEMO_SEED_ENABLED:-true}
    volumes:
      - ../scripts/k8s/schema.sql:/init/schema.sql:ro
      - ../scripts/k8s/demo-seed.sql:/init/demo-seed.sql:ro
      - ../scripts/k8s/apply-demo-seed.sh:/init/apply-demo-seed.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        mysql --default-character-set=utf8mb4 -hmysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" < /init/schema.sql
        sh /init/apply-demo-seed.sh
    restart: "no"

  auth-api:
    image: flash-mall/auth-api:${FLASH_MALL_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: build/docker/auth-api.Dockerfile
    container_name: auth-api
    environment:
      FLASH_MALL_AUTH_DATASOURCE: "root:${FLASH_MALL_MYSQL_ROOT_PASSWORD:-6494kj06}@tcp(mysql:3306)/mall_auth?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai"
      FLASH_MALL_JWT_AUTH_SECRET: ${FLASH_MALL_JWT_AUTH_SECRET:-flash-mall-local-jwt-secret}
      FLASH_MALL_DEMO_PASSWORD: ${FLASH_MALL_DEMO_PASSWORD:-flashmall123}
    volumes:
      - ./config/auth-api.yaml:/etc/flash-mall/auth-api.yaml:ro
    command: ["-f", "/etc/flash-mall/auth-api.yaml"]
    ports:
      - "8890:8890"
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  product-rpc:
    image: flash-mall/product-rpc:${FLASH_MALL_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: build/docker/product-rpc.Dockerfile
    container_name: product-rpc
    environment:
      FLASH_MALL_PRODUCT_DATASOURCE: "root:${FLASH_MALL_MYSQL_ROOT_PASSWORD:-6494kj06}@tcp(mysql:3306)/mall_product?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai"
      FLASH_MALL_JWT_AUTH_SECRET: ${FLASH_MALL_JWT_AUTH_SECRET:-flash-mall-local-jwt-secret}
      FLASH_MALL_AUTH_SERVICE_BASE_URL: http://auth-api:8890
      FLASH_MALL_PAYMENT_CALLBACK_SECRET: ${FLASH_MALL_PAYMENT_CALLBACK_SECRET:-flash-mall-local-payment-secret}
      FLASH_MALL_INVENTORY_KITEX_ENDPOINT: inventory-kitex:8093
    volumes:
      - ./config/product.yaml:/etc/flash-mall/product.yaml:ro
    command: ["-f", "/etc/flash-mall/product.yaml"]
    ports:
      - "8080:8080"
      - "6062:6062"
      - "9092:9092"
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      etcd:
        condition: service_started

  order-rpc:
    image: flash-mall/order-rpc:${FLASH_MALL_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: build/docker/order-rpc.Dockerfile
    container_name: order-rpc
    environment:
      FLASH_MALL_ORDER_DATASOURCE: "root:${FLASH_MALL_MYSQL_ROOT_PASSWORD:-6494kj06}@tcp(mysql:3306)/mall_order?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai"
      FLASH_MALL_AUTH_DATASOURCE: "root:${FLASH_MALL_MYSQL_ROOT_PASSWORD:-6494kj06}@tcp(mysql:3306)/mall_auth?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai"
      FLASH_MALL_RABBITMQ_URL: "amqp://${FLASH_MALL_RABBITMQ_USER:-flashmall}:${FLASH_MALL_RABBITMQ_PASSWORD:-flashmall-local}@rabbitmq:5672/"
      FLASH_MALL_INVENTORY_KITEX_ENDPOINT: inventory-kitex:8093
      FLASH_MALL_PAYMENT_PROVIDER: ${FLASH_MALL_PAYMENT_PROVIDER:-local_sandbox}
      FLASH_MALL_ALIPAY_APP_ID: ${FLASH_MALL_ALIPAY_APP_ID:-}
      FLASH_MALL_ALIPAY_GATEWAY_URL: ${FLASH_MALL_ALIPAY_GATEWAY_URL:-https://openapi-sandbox.dl.alipaydev.com/gateway.do}
      FLASH_MALL_ALIPAY_PRIVATE_KEY: ${FLASH_MALL_ALIPAY_PRIVATE_KEY:-}
      FLASH_MALL_ALIPAY_PUBLIC_KEY: ${FLASH_MALL_ALIPAY_PUBLIC_KEY:-}
      FLASH_MALL_ALIPAY_NOTIFY_URL: ${FLASH_MALL_ALIPAY_NOTIFY_URL:-}
    volumes:
      - ./config/order.yaml:/etc/flash-mall/order.yaml:ro
    command: ["-f", "/etc/flash-mall/order.yaml"]
    ports:
      - "8090:8090"
      - "6061:6061"
      - "9091:9091"
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
      etcd:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      product-rpc:
        condition: service_started
      inventory-kitex:
        condition: service_started

  inventory-kitex:
    image: flash-mall/inventory-kitex:${FLASH_MALL_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: build/docker/inventory-kitex.Dockerfile
    container_name: inventory-kitex
    environment:
      INVENTORY_LISTEN_ON: 0.0.0.0:8093
      INVENTORY_METRICS_LISTEN_ON: 0.0.0.0:9093
      INVENTORY_PPROF_LISTEN_ON: 0.0.0.0:6063
      INVENTORY_REDIS_HOST: redis:6379
      INVENTORY_DATASOURCE: "root:${FLASH_MALL_MYSQL_ROOT_PASSWORD:-6494kj06}@tcp(mysql:3306)/mall_product?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai"
      INVENTORY_STOCK_SHARD_COUNT: 4
      INVENTORY_FINAL_DEDUCT_ENABLED: ${FLASH_MALL_INVENTORY_FINAL_DEDUCT_ENABLED:-true}
      INVENTORY_RESERVATION_LEDGER_MODE: ${FLASH_MALL_INVENTORY_RESERVATION_LEDGER_MODE:-enforce}
      INVENTORY_RESERVATION_RECOVERY_INTERVAL: ${FLASH_MALL_INVENTORY_RESERVATION_RECOVERY_INTERVAL:-1m}
      INVENTORY_RESERVATION_RECOVERY_BATCH_SIZE: ${FLASH_MALL_INVENTORY_RESERVATION_RECOVERY_BATCH_SIZE:-100}
      INVENTORY_RESERVATION_METRICS_INTERVAL: ${FLASH_MALL_INVENTORY_RESERVATION_METRICS_INTERVAL:-15s}
      INVENTORY_TRACING_ENABLED: "true"
      INVENTORY_TRACING_SERVICE_NAME: inventory-kitex
      INVENTORY_TRACING_EXPORTER: otlphttp
      INVENTORY_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      INVENTORY_TRACING_SAMPLE_RATIO: "${FLASH_MALL_TRACING_SAMPLE_RATIO:-0.1}"
    ports:
      - "8093:8093"
      - "9093:9093"
      - "127.0.0.1:6063:6063"
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully

  entry-api:
    image: flash-mall/entry-api:${FLASH_MALL_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: build/docker/entry-api.Dockerfile
    container_name: entry-api
    profiles: ["legacy-entry"]
    environment:
      FLASH_MALL_ORDER_DATASOURCE: "root:${FLASH_MALL_MYSQL_ROOT_PASSWORD:-6494kj06}@tcp(mysql:3306)/mall_order?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai"
      FLASH_MALL_RABBITMQ_URL: "amqp://${FLASH_MALL_RABBITMQ_USER:-flashmall}:${FLASH_MALL_RABBITMQ_PASSWORD:-flashmall-local}@rabbitmq:5672/"
      FLASH_MALL_JWT_AUTH_SECRET: ${FLASH_MALL_JWT_AUTH_SECRET:-flash-mall-local-jwt-secret}
      FLASH_MALL_PAYMENT_CALLBACK_SECRET: ${FLASH_MALL_PAYMENT_CALLBACK_SECRET:-flash-mall-local-payment-secret}
      FLASH_MALL_INVENTORY_KITEX_ENDPOINT: inventory-kitex:8093
      FLASH_MALL_INVENTORY_OWNS_FINAL_DEDUCT: ${FLASH_MALL_INVENTORY_OWNS_FINAL_DEDUCT:-true}
    volumes:
      - ./config/entry-api.yaml:/etc/flash-mall/entry-api.yaml:ro
    command: ["-f", "/etc/flash-mall/entry-api.yaml"]
    ports:
      - "8888:8888"
      - "6060:6060"
      - "9090:9090"
    depends_on:
      auth-api:
        condition: service_started
      product-rpc:
        condition: service_started
      order-rpc:
        condition: service_started
      inventory-kitex:
        condition: service_started
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
      dtm:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  hertz-gateway:
    image: flash-mall/hertz-gateway:${FLASH_MALL_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: build/docker/hertz-gateway.Dockerfile
    container_name: hertz-gateway
    environment:
      FLASH_MALL_PRODUCT_DATASOURCE: "root:${FLASH_MALL_MYSQL_ROOT_PASSWORD:-6494kj06}@tcp(mysql:3306)/mall_product?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai"
      FLASH_MALL_ORDER_DATASOURCE: "root:${FLASH_MALL_MYSQL_ROOT_PASSWORD:-6494kj06}@tcp(mysql:3306)/mall_order?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai"
      FLASH_MALL_AUTH_DATASOURCE: "root:${FLASH_MALL_MYSQL_ROOT_PASSWORD:-6494kj06}@tcp(mysql:3306)/mall_auth?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai"
      FLASH_MALL_JWT_AUTH_SECRET: ${FLASH_MALL_JWT_AUTH_SECRET:-flash-mall-local-jwt-secret}
      FLASH_MALL_AUTH_SERVICE_BASE_URL: http://auth-api:8890
      FLASH_MALL_PAYMENT_CALLBACK_SECRET: ${FLASH_MALL_PAYMENT_CALLBACK_SECRET:-flash-mall-local-payment-secret}
      FLASH_MALL_INVENTORY_KITEX_ENDPOINT: inventory-kitex:8093
      FLASH_MALL_CACHE_REDIS_ADDR: redis:6379
    volumes:
      - ./config/gateway.yaml:/etc/flash-mall/gateway.yaml:ro
      - flash-mall-uploads:/data/flash-mall/uploads
    command: ["-f", "/etc/flash-mall/gateway.yaml"]
    ports:
      - "8889:8889"
      - "127.0.0.1:6064:6064"
    depends_on:
      product-rpc:
        condition: service_started
      inventory-kitex:
        condition: service_started
      order-rpc:
        condition: service_started
      dtm:
        condition: service_started
      etcd:
        condition: service_started

volumes:
  flash-mall-uploads:
    name: flash-mall-uploads
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:
