Name: hertz-gateway
ListenOn: 0.0.0.0:8889
DataSource: ${FLASH_MALL_PRODUCT_DATASOURCE}
OrderDataSource: ${FLASH_MALL_ORDER_DATASOURCE}
AuthDataSource: ${FLASH_MALL_AUTH_DATASOURCE}
JwtAuthSecret: ${FLASH_MALL_JWT_AUTH_SECRET}
AuthServiceBaseURL: ${FLASH_MALL_AUTH_SERVICE_BASE_URL}
PaymentCallbackSecret: ${FLASH_MALL_PAYMENT_CALLBACK_SECRET}
PaymentCallbackMaxSkewSeconds: 300
SandboxPaymentTokenTTLSeconds: 900
InventoryKitexEndpoint: ${FLASH_MALL_INVENTORY_KITEX_ENDPOINT}
DtmServer: 127.0.0.1:36790
OrderRpcTarget: 127.0.0.1:8090
DtmTimeoutToFailSeconds: 120
DtmRequestTimeoutSeconds: 6
DtmWaitResult: true
EnableLiveStockOverlay: false
UploadDir: .runtime/uploads

ProductRpcConf:
  Endpoints:
    - 127.0.0.1:8080
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: product.rpc
  Timeout: 3000

OrderRpcConf:
  Endpoints:
    - 127.0.0.1:8090
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: order.rpc
  Timeout: 3000

CatalogProductIDs:
  - 100
  - 101
  - 102
  - 103
  - 104
