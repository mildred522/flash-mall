apiVersion: apps/v1
kind: Deployment
metadata:
  name: hertz-gateway
  namespace: flash-mall
  labels:
    app.kubernetes.io/name: hertz-gateway
    app.kubernetes.io/part-of: flash-mall
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hertz-gateway
  template:
    metadata:
      labels:
        app: hertz-gateway
    spec:
      containers:
        - name: hertz-gateway
          image: flash-mall/hertz-gateway:dev
          imagePullPolicy: IfNotPresent
          args: ["-f", "/etc/flash-mall/gateway.yaml"]
          env:
            - name: FLASH_MALL_PRODUCT_DATASOURCE
              valueFrom:
                secretKeyRef:
                  name: flash-mall-runtime-secrets
                  key: product-datasource
            - name: FLASH_MALL_ORDER_DATASOURCE
              valueFrom:
                secretKeyRef:
                  name: flash-mall-runtime-secrets
                  key: order-datasource
            - name: FLASH_MALL_AUTH_DATASOURCE
              valueFrom:
                secretKeyRef:
                  name: flash-mall-runtime-secrets
                  key: auth-datasource
            - name: FLASH_MALL_JWT_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: flash-mall-runtime-secrets
                  key: jwt-auth-secret
            - name: FLASH_MALL_PAYMENT_CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: flash-mall-runtime-secrets
                  key: payment-callback-secret
            - name: FLASH_MALL_INVENTORY_KITEX_ENDPOINT
              value: inventory-kitex:8093
            - name: FLASH_MALL_CACHE_REDIS_ADDR
              value: redis:6379
          ports:
            - name: http
              containerPort: 8889
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          volumeMounts:
            - name: hertz-gateway-config
              mountPath: /etc/flash-mall
            - name: hertz-gateway-uploads
              mountPath: /data/flash-mall/uploads
      volumes:
        - name: hertz-gateway-config
          configMap:
            name: hertz-gateway-config
        - name: hertz-gateway-uploads
          hostPath:
            path: /var/lib/flash-mall/uploads
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: hertz-gateway
  namespace: flash-mall
  labels:
    app.kubernetes.io/name: hertz-gateway
spec:
  selector:
    app: hertz-gateway
  ports:
    - name: http
      port: 8889
      targetPort: http
